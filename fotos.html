<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  :root{
    --azul-noite:#0d1b2a;
    --azul-doca:#1b3a4b;
    --azulejo:#2a6f77;
    --terracota:#c1552c;
    --areia:#f2ead8;
    --branco:#fffaf1;
    --texto:#12242e;
    --linha:#d9cdb2;
  }
  body{font-family:'Helvetica Neue', Arial, sans-serif;}
  html,body{height:100%;}
  .galeria-pagina{
    position:fixed; inset:0;
    background:#070f17;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .galeria-logo-link{ display:block; }
  .galeria-logo{
    width:100px; height:auto; flex-shrink:0;
    margin:max(20px, env(safe-area-inset-top, 0px)) 0 8px;
  }
  .galeria-foto-wrap{
    position:relative; flex:1; width:100%; min-height:0;
    display:flex; align-items:center; justify-content:center; overflow:hidden;
    background:#04090f;
  }
  .galeria-foto{
    width:100%; height:100%; object-fit:cover; display:block;
    transition:opacity .28s ease;
  }
  .galeria-seta{
    position:absolute; top:50%; transform:translateY(-50%); z-index:2;
    width:42px; height:42px; border-radius:50%;
    background:rgba(7,15,23,.5); border:1px solid rgba(255,255,255,.25);
    color:var(--branco); font-size:23px; line-height:1; cursor:pointer;
  }
  .galeria-seta-esq{ left:12px; }
  .galeria-seta-dir{ right:12px; }
  .galeria-legenda{
    color:var(--areia); font-family:'Helvetica Neue', Arial, sans-serif; font-size:15px;
    text-align:center; padding:16px 26px 4px; max-width:640px; line-height:1.55;
    min-height:1.4em; flex-shrink:0;
  }
  .galeria-dots{ display:flex; gap:8px; padding:12px 0; flex-shrink:0; }
  .galeria-dots button{
    width:8px; height:8px; border-radius:50%; border:none; background:rgba(255,255,255,.3); padding:0; cursor:pointer;
  }
  .galeria-dots button.ativo{ background:var(--terracota); width:20px; border-radius:5px; }
  .galeria-qr{
    display:none; align-items:center; gap:10px; text-decoration:none;
    padding:6px 20px calc(16px + env(safe-area-inset-bottom, 0px)); flex-shrink:0;
  }
  .galeria-qr img{ width:78px; height:78px; border-radius:8px; background:#fff; padding:6px; display:block; }
  .galeria-qr span{ color:var(--areia); font-family:'Helvetica Neue', Arial, sans-serif; font-size:12px; max-width:130px; line-height:1.4; }
  .galeria-vazia{
    display:none; flex:1; width:100%; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:0 40px; color:var(--areia);
  }
  .galeria-vazia p{font-size:15px; line-height:1.6; max-width:420px;}
</style>
</head>

  <div class="galeria-foto-wrap" id="galeriaFotoWrap">
    <img class="galeria-foto" id="galeriaFotoImg" alt="">
    <button type="button" class="galeria-seta galeria-seta-esq" id="galeriaAnterior" aria-label="Foto anterior">‹</button>
    <button type="button" class="galeria-seta galeria-seta-dir" id="galeriaSeguinte" aria-label="Foto seguinte">›</button>
  </div>
  <p class="galeria-legenda" id="galeriaLegenda"></p>
  <div class="galeria-dots" id="galeriaDots"></div>
  <a class="galeria-qr" id="galeriaQrLink" href="#" target="_blank" rel="noopener" style="display:none;">
    <img id="galeriaQrImg" alt="QR code">
    <span>Peça já a sua cotação</span>
  </a>
  <div class="galeria-vazia" id="galeriaVazia">
    <p>Ainda não há fotos publicadas para mostrar aqui.</p>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCqJBnzZh5MWP9G3ZP1nOThb4W2KCLf2a4",
    authDomain: "trajeto-app.firebaseapp.com",
    projectId: "trajeto-app",
    storageBucket: "trajeto-app.firebasestorage.app",
    messagingSenderId: "149828521686",
    appId: "1:149828521686:web:255f9dd3f9056be451c377"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // ---------- Galeria de fotos (apresentação em ecrã inteiro, até 4 fotos) ----------
  let galeriaFotos = [];
  let galeriaIndice = 0;
  let galeriaTimer = null;
  const GALERIA_INTERVALO_MS = 6000;

  function galeriaPrefereMenosMovimento(){
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }
  function galeriaMostrarIndice(i, instantaneo){
    if(!galeriaFotos.length) return;
    galeriaIndice = ((i % galeriaFotos.length) + galeriaFotos.length) % galeriaFotos.length;
    const item = galeriaFotos[galeriaIndice];
    const img = document.getElementById('galeriaFotoImg');
    const legendaEl = document.getElementById('galeriaLegenda');
    const trocar = ()=>{
      img.src = item.foto;
      legendaEl.textContent = item.legenda || '';
      img.style.opacity = '1';
    };
    if(instantaneo || galeriaPrefereMenosMovimento()){ trocar(); }
    else { img.style.opacity = '0'; setTimeout(trocar, 260); }
    document.querySelectorAll('#galeriaDots button').forEach((b, idx)=>{ b.classList.toggle('ativo', idx === galeriaIndice); });
  }
  function galeriaReiniciarTimer(){
    if(galeriaTimer) clearInterval(galeriaTimer);
    if(galeriaFotos.length < 2 || galeriaPrefereMenosMovimento()) return;
    galeriaTimer = setInterval(()=> galeriaMostrarIndice(galeriaIndice + 1), GALERIA_INTERVALO_MS);
  }
  function galeriaProxima(){ galeriaMostrarIndice(galeriaIndice + 1); galeriaReiniciarTimer(); }
  function galeriaAnteriorFn(){ galeriaMostrarIndice(galeriaIndice - 1); galeriaReiniciarTimer(); }
  function galeriaMontarDots(){
    const dotsEl = document.getElementById('galeriaDots');
    dotsEl.innerHTML = '';
    galeriaFotos.forEach((_, idx)=>{
      const b = document.createElement('button');
      b.type = 'button';
      b.setAttribute('aria-label', `Foto ${idx+1}`);
      b.addEventListener('click', ()=>{ galeriaMostrarIndice(idx); galeriaReiniciarTimer(); });
      dotsEl.appendChild(b);
    });
  }
  function iniciarGaleria(){
    if(!galeriaFotos.length){
      document.getElementById('galeriaVazia').style.display = 'flex';
      return;
    }
    galeriaMostrarIndice(0, true);
    galeriaReiniciarTimer();
  }
  document.getElementById('galeriaAnterior').addEventListener('click', galeriaAnteriorFn);
  document.getElementById('galeriaSeguinte').addEventListener('click', galeriaProxima);
  {
    let toqueX = null;
    const wrapEl = document.getElementById('galeriaFotoWrap');
    wrapEl.addEventListener('touchstart', (e)=>{ toqueX = e.touches[0].clientX; }, {passive:true});
    wrapEl.addEventListener('touchend', (e)=>{
      if(toqueX === null) return;
      const dx = e.changedTouches[0].clientX - toqueX;
      if(dx > 40) galeriaAnteriorFn();
      else if(dx < -40) galeriaProxima();
      toqueX = null;
    });
  }


  // ---------- Resolver a que motorista pertence este link ----------
  const paramMotorista = new URLSearchParams(window.location.search).get('m');
  const resolucaoMotorista = paramMotorista
    ? Promise.resolve(paramMotorista)
    : (async ()=>{
        try{
          const snap = await getDoc(doc(db, 'trajeto_publico', 'motorista_padrao'));
          if(snap.exists() && snap.data().uid) return snap.data().uid;
        }catch(e){ /* sem motorista resolvido — mostra o estado vazio */ }
        return null;
      })();

  (async ()=>{
    try{
      const uid = await resolucaoMotorista;
      const linkPedido = window.location.origin + '/' + (paramMotorista ? `?m=${encodeURIComponent(paramMotorista)}` : '');
      document.getElementById('galeriaLogoLink').href = linkPedido;
      if(!uid){ iniciarGaleria(); return; }
      const snap = await getDoc(doc(db, 'trajeto_publico', uid));
      const dadosPublicos = snap.exists() ? snap.data() : {};
      if(Array.isArray(dadosPublicos.galeria)){
        galeriaFotos = dadosPublicos.galeria.filter(item => item && item.foto);
      }
      if(galeriaFotos.length){
        galeriaMontarDots();
        const qrLink = document.getElementById('galeriaQrLink');
        const qrImg = document.getElementById('galeriaQrImg');
        qrImg.onerror = ()=>{ qrLink.style.display = 'none'; };
        qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${encodeURIComponent(linkPedido)}`;
        qrLink.href = linkPedido;
        qrLink.style.display = 'flex';
      }
      iniciarGaleria();
    }catch(e){
      iniciarGaleria();
    }
  })();
</script>
